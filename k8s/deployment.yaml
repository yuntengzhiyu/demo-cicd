apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-cicd
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-cicd
  template:
    metadata:
      labels:
        app: demo-cicd
    spec:
      containers:
      - name: demo-cicd
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-cicd
  namespace: default
spec:
  type: NodePort
  selector:
    app: demo-cicd
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30081
